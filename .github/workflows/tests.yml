# Runs on every pull request: the full paper desk test suite, the deploy
# checklist, and the city build. Paper only; no secrets are used.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            paper-bots/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r paper-bots/requirements.txt pytest
      - name: Deploy checklist
        run: python paper-bots/tools/deploy_check.py local
      - name: Tests
        working-directory: paper-bots
        run: timeout 1500 python -m pytest -q -x -p no:cacheprovider

  city:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trading-city/package-lock.json
      - name: Build the city
        working-directory: trading-city
        run: |
          npm ci
          npm run build
